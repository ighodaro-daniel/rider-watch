<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rider Watch | Sign in</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="eyebrow">RIDER WATCH / DISPATCH CONTROL</div>
    <h1>Keep every delivery<br><span>in sight.</span></h1>
    <p class="lede">A calm, live view of your riders and the handoffs that matter.</p>
    <!--LOGIN_ERROR-->
    <form action="/login" method="post">
      <label>Owner ID<input name="username" autocomplete="username" required></label>
      <label>Passphrase<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Enter control room <span>↗</span></button>
    </form>
    <p class="login-note">Private dispatch workspace · local session</p>
  </main>
</body>
</html>
