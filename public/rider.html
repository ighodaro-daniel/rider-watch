<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rider Watch | Sharing location</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="rider-page">
  <main class="rider-card">
    <div class="eyebrow">RIDER WATCH</div>
    <h1 class="rider-title">Your location,<br><span>your choice.</span></h1>
    <p class="lede">Your dispatcher can see your live location while sharing is on. Start only when you’re ready.</p>
    <div class="rider-actions">
      <button type="button" id="start-sharing">Start sharing</button>
      <button type="button" id="stop-sharing" class="secondary-button" disabled>Stop sharing</button>
    </div>
    <div class="rider-state">
      <span class="status-dot" id="rider-dot"></span>
      <span id="rider-status">Location is not being shared.</span>
    </div>
    <p class="rider-detail mono" id="rider-detail"></p>
    <p class="rider-note">Your phone asks permission before sharing. You can stop at any time; closing this page also stops sharing.</p>
  </main>
  <script src="/js/rider.js"></script>
</body>
</html>
