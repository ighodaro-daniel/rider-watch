<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rider Watch | Sharing location</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="rider-page">
  <main class="rider-card">
    <div class="eyebrow">RIDER WATCH</div>
    <h1 class="rider-title">Your location is<br><span>being shared.</span></h1>
    <p class="lede">Your dispatcher can see where you are until you close this page.</p>
    <div class="rider-state">
      <span class="status-dot" id="rider-dot"></span>
      <span id="rider-status">Starting location sharing…</span>
    </div>
    <p class="rider-detail mono" id="rider-detail"></p>
    <p class="rider-note">This page sends your position only to your dispatcher's dashboard. Close it to stop sharing.</p>
  </main>
  <script src="/js/rider.js"></script>
</body>
</html>
